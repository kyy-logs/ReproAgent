name: AI tool integration

on: [push, pull_request, workflow_dispatch]

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tool environment
        shell: bash
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          echo "REPRO_TOOL_PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install -e ".[dev]"
      - name: Validate official Python installer URL
        if: runner.os == 'Windows' && matrix.python == '3.13'
        shell: pwsh
        run: |
          $runtime = Get-Content -Raw -LiteralPath scripts/python-runtime.json | ConvertFrom-Json
          $uri = [uri]$runtime.installer_url
          if ($uri.Scheme -ne 'https' -or $uri.Host -ne 'www.python.org') {
            throw 'The Python fallback must use the official HTTPS download host.'
          }
          $response = Invoke-WebRequest -Method Head -Uri $uri.AbsoluteUri -TimeoutSec 30
          if ($response.StatusCode -ne 200) {
            throw "Python installer is unavailable: $($response.StatusCode)"
          }
          Write-Host "Verified Python $($runtime.version) installer: $uri"
      - name: Run integration setup tests
        shell: bash
        run: |
          "$REPRO_TOOL_PYTHON" -m pytest \
            tests/unit/test_integration_hosts.py \
            tests/unit/test_integration_render.py \
            tests/unit/test_integration_credentials.py \
            tests/unit/test_integration_manifest.py \
            tests/unit/test_integration_launcher.py \
            tests/unit/test_integration_setup.py \
            tests/integration/test_integration_launchers.py \
            tests/integration/test_integration_setup_cli.py \
            tests/integration/test_integration_package.py \
            tests/unit/test_windows_bootstrap.py \
            tests/unit/test_windows_project_check.py \
            tests/integration/test_windows_bootstrap_entry.py \
            tests/integration/test_windows_bootstrap_offline.py \
            tests/integration/test_windows_python_fallback.py \
            -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
