name: News

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-main
  cancel-in-progress: false

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip news]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update docs/NEWS.md
        run: python scripts/update_news.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/NEWS.md README.md README_zh.md; then
            echo "No news changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NEWS.md README.md README_zh.md
          git commit -m "docs: update news [skip news]"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "Failed to push the news update." >&2
          exit 1
