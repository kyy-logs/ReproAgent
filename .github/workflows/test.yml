name: Offline tests
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        target-python: ['3.10', '3.11', '3.12']
        target-pytest: ['pytest==7.4.4', 'pytest>=8,<9', 'pytest>=9,<10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: target
        with:
          python-version: ${{ matrix.target-python }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/unit tests/integration -q
        env:
          REPRO_TEST_TARGET_PYTHON: ${{ steps.target.outputs.python-path }}
          REPRO_TEST_PYTEST_VERSION: ${{ matrix.target-pytest }}
      - run: python -m pip check
