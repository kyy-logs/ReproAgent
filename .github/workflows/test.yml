name: Offline tests
on: [push, pull_request, workflow_dispatch]
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        target-python: ['3.10', '3.11', '3.12']
        target-pytest: ['pytest==7.4.4', 'pytest>=8,<9', 'pytest>=9,<10']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: target
        with:
          python-version: ${{ matrix.target-python }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The launcher and the Skill expect the tool environment at .venv, as in
      # the README; tests read it back through that fixed path.
      - name: Install tool environment
        shell: bash
        run: |
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=.venv/Scripts/python.exe; fi
          echo "REPRO_TOOL_PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install -e ".[dev]"
      # The SDK search path is the strongest Grep protection (refusal vs "no matches",
      # ordered multi-run search, width-correct citations) and its tests skip themselves
      # when no ripgrep is found, so one is installed from the host's own package manager.
      # The same resolution the tests use (shutil.which, which knows about the Windows
      # .exe) names it afterwards; a host without one fails here instead of skipping.
      - name: Install ripgrep for the search-path tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep --no-progress -y || true
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
          RG="$("$REPRO_TOOL_PYTHON" -c 'import shutil,sys; p=shutil.which("rg") or shutil.which("rg.exe"); print(p); sys.exit(0 if p else 1)')"
          echo "REPROAGENT_RG_PATH=$RG" >> "$GITHUB_ENV"
      - name: Run offline tests
        shell: bash
        run: |
          "$REPRO_TOOL_PYTHON" -m pytest tests/unit tests/integration -q
        env:
          REPRO_TEST_TARGET_PYTHON: ${{ steps.target.outputs.python-path }}
          REPRO_TEST_PYTEST_VERSION: ${{ matrix.target-pytest }}
      - name: Check dependencies
        shell: bash
        run: |
          "$REPRO_TOOL_PYTHON" -m pip check
