<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="935" viewBox="0 0 1600 935"><rect width="1600" height="935" fill="white"/><text x="60.0" y="78.0" fill="#162B3E" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="700">记忆如何按需进入本次上下文</text><text x="60.0" y="127.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">不同信息分别维护；检索结果经过范围、证据与时效筛选</text><rect x="60" y="195" width="425" height="118" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="214.5" y="244.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700">项目状态</text><text x="132.5" y="279.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400">当前目标 · 进度 · 待完成事项</text><polyline points="485,254 560,254 560,453 650,453" fill="none" stroke="#52677A" stroke-width="4"/><polygon points="650.0,453.0 635.6,460.0 635.6,446.0" fill="#52677A"/><rect x="60" y="342" width="425" height="118" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="200.0" y="391.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700">事实与偏好</text><text x="164.0" y="426.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400">已确认约束 · 用户偏好</text><polyline points="485,401 560,401 560,453 650,453" fill="none" stroke="#52677A" stroke-width="4"/><polygon points="650.0,453.0 635.6,460.0 635.6,446.0" fill="#52677A"/><rect x="60" y="489" width="425" height="118" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="214.5" y="538.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700">经验记忆</text><text x="132.5" y="573.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400">适用条件 · 原因 · 修复与反例</text><polyline points="485,548 560,548 560,453 650,453" fill="none" stroke="#52677A" stroke-width="4"/><polygon points="650.0,453.0 635.6,460.0 635.6,446.0" fill="#52677A"/><rect x="60" y="636" width="425" height="118" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="214.5" y="685.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700">原始轨迹</text><text x="143.5" y="720.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="22" font-weight="400">完整消息 · 工具结果 · 证据</text><polyline points="485,695 560,695 560,453 650,453" fill="none" stroke="#52677A" stroke-width="4"/><polygon points="650.0,453.0 635.6,460.0 635.6,446.0" fill="#52677A"/><rect x="650" y="354" width="355" height="205" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="750.0" y="405.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">检索与筛选</text><text x="695.5" y="440.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">先限定用户、项目和环境</text><text x="731.5" y="473.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">关键词或语义检索</text><text x="707.5" y="506.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">排序、去重、回查证据</text><rect x="1190" y="354" width="350" height="205" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="1287.5" y="405.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="31" font-weight="700">本次上下文</text><text x="1257.0" y="440.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">当前任务与近期观察</text><text x="1293.0" y="473.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">少量重要事实</text><text x="1245.0" y="506.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">按需召回的经验与证据</text><polyline points="1005,453 1190,453" fill="none" stroke="#286B9B" stroke-width="4"/><polygon points="1190.0,453.0 1175.6,460.0 1175.6,446.0" fill="#286B9B"/><text x="1302.5" y="312.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="700">预算内加载</text><rect x="650" y="660" width="890" height="120" rx="18" fill="#F3F8FC" stroke="#DCE5EC" stroke-width="2"/><text x="680.0" y="710.0" fill="#162B3E" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="700">摘要用于筛选，关键结论回查原始记录。</text><text x="680.0" y="756.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">当前观察优先核对；冲突和未验证状态要保留。</text><text x="60.0" y="878.0" fill="#162B3E" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700">信息越多不一定越好：目标是让相关且可靠的信息影响行动。</text></svg>