<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090"><rect width="1600" height="1090" fill="white"/><text x="60.0" y="78.0" fill="#162B3E" font-family="Microsoft YaHei,sans-serif" font-size="40" font-weight="700">从一次排错到可复用技能</text><text x="60.0" y="127.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">假设案例：复现实验指标偏低，发现并验证了预处理顺序差异</text><rect x="60" y="190" width="430" height="180" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="140.0" y="240.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="700">一次任务与原始证据</text><text x="160.0" y="278.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400">异常结果 · 配置差异</text><text x="160.0" y="313.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400">修正步骤 · 验证产出</text><rect x="585" y="190" width="430" height="180" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="660.0" y="238.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="28" font-weight="700">有适用范围的经验记忆</text><text x="670.0" y="278.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400">该项目曾因归一化顺序</text><text x="683.0" y="313.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400">不一致导致指标偏低</text><rect x="1110" y="190" width="430" height="180" rx="18" fill="#F3F7FA" stroke="#DCE5EC" stroke-width="2"/><text x="1235.0" y="240.0" fill="#286B9B" font-family="Microsoft YaHei,sans-serif" font-size="30" font-weight="700">后续相似任务</text><text x="1234.0" y="278.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400">先检查是否适用</text><text x="1195.0" y="313.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="400">使用新观察确认或纠正</text><polyline points="490,280 585,280" fill="none" stroke="#286B9B" stroke-width="4"/><polygon points="585.0,280.0 570.6,287.0 570.6,273.0" fill="#286B9B"/><polyline points="1015,280 1110,280" fill="none" stroke="#286B9B" stroke-width="4"/><polygon points="1110.0,280.0 1095.6,287.0 1095.6,273.0" fill="#286B9B"/><polyline points="1325,370 1325,526" fill="none" stroke="#337B64" stroke-width="4"/><polygon points="1325.0,526.0 1318.0,511.6 1332.0,511.6" fill="#337B64"/><text x="1345.0" y="460.0" fill="#337B64" font-family="Microsoft YaHei,sans-serif" font-size="24" font-weight="400">积累证据与反例</text><rect x="1110" y="526" width="430" height="206" rx="18" fill="#EEF6F1" stroke="#DCE5EC" stroke-width="2"/><text x="1238.0" y="575.0" fill="#337B64" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700">提炼技能候选</text><text x="1173.5" y="613.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">数据版本 → 划分 → 预处理</text><text x="1177.0" y="647.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">→ 指标口径 → 小规模验证</text><text x="1200.0" y="681.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">参数从项目上下文读取</text><rect x="585" y="526" width="430" height="206" rx="18" fill="#EEF6F1" stroke="#DCE5EC" stroke-width="2"/><text x="684.0" y="575.0" fill="#337B64" font-family="Microsoft YaHei,sans-serif" font-size="29" font-weight="700">检验泛化与副作用</text><text x="687.5" y="613.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">不同原因的异常任务</text><text x="687.5" y="647.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">正常任务与无关任务</text><text x="687.5" y="681.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">检查误用及额外成本</text><rect x="60" y="526" width="430" height="206" rx="18" fill="#EEF6F1" stroke="#DCE5EC" stroke-width="2"/><text x="126.5" y="573.0" fill="#337B64" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700">可复用技能或待修正候选</text><text x="130.5" y="613.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">通过验证 → 保留有效版本</text><text x="155.5" y="647.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">未通过 → 修正或回滚</text><text x="162.5" y="681.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">保留来源与版本记录</text><polyline points="1110,629 1015,629" fill="none" stroke="#337B64" stroke-width="4"/><polygon points="1015.0,629.0 1029.4,622.0 1029.4,636.0" fill="#337B64"/><polyline points="585,629 490,629" fill="none" stroke="#337B64" stroke-width="4"/><polygon points="490.0,629.0 504.4,622.0 504.4,636.0" fill="#337B64"/><polyline points="275,732 275,850 1570,850 1570,280 1540,280" fill="none" stroke="#337B64" stroke-width="4" stroke-dasharray="10 8"/><polygon points="1540.0,280.0 1554.4,273.0 1554.4,287.0" fill="#337B64"/><text x="537.5" y="893.0" fill="#337B64" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">有效技能回到后续任务调用，反馈继续驱动演化</text><rect x="60" y="912" width="1480" height="115" rx="18" fill="#F8FAFC" stroke="#DCE5EC" stroke-width="2"/><text x="95.0" y="961.0" fill="#162B3E" font-family="Microsoft YaHei,sans-serif" font-size="27" font-weight="700">记忆保留具体经验与证据；技能表达可复用方法。</text><text x="95.0" y="1003.0" fill="#52677A" font-family="Microsoft YaHei,sans-serif" font-size="25" font-weight="400">不能从一次排错推断“所有指标偏低都应调整归一化”。</text></svg>