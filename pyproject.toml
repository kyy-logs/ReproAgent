[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reproagent-local"
version = "0.1.0"
description = "Evidence-first local Python bug reproduction agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
# Tests build a wheel with --no-build-isolation, which needs the backend importable.
dev = ["pytest>=8,<10", "wheel", "setuptools>=68"]
agentscope = ["agentscope==2.0.9"]

[project.scripts]
reproagent = "reproagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reproagent = ["prompts/*.md", "adapters/languages/python_pytest/probe/*.py", "resources/*.py", "resources/*.template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
